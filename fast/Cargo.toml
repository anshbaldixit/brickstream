[package]
name = "fast"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "The Shopping Sessions pipeline in Rust"

[[bin]]
name = "fast"
path = "src/main.rs"

[dependencies]
libc = "0.2.191"
memchr = "2.8.3"
memmap2 = "0.9.12"
mimalloc = { version = "0.1.52", default-features = false }
rayon = "1.12.0"
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

# Same code generation without LTO, so `cargo test` and quick experiments build fast.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# Release code generation plus line tables, for `perf report --sort srcline`.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
